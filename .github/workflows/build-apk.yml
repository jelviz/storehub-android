name: Build DINAL StoreHub V13 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'storehub-v13-source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract V13 source and verify features
        run: |
          rm -rf v13
          mkdir -p v13
          unzip -q -o storehub-v13-source.zip -d v13
          test -f v13/StoreHubAndroid/app/build.gradle.kts
          grep -q 'versionName = "13.0.0"' v13/StoreHubAndroid/app/build.gradle.kts
          grep -q 'versionCode = 13' v13/StoreHubAndroid/app/build.gradle.kts
          grep -q 'fun DinalSplashScreen' v13/StoreHubAndroid/app/src/main/java/ir/dinal/storehub/ui/SplashScreen.kt
          grep -q 'DINALKADO.COM' v13/StoreHubAndroid/app/src/main/java/ir/dinal/storehub/ui/SplashScreen.kt
          grep -q 'fun SmartProductScreen' v13/StoreHubAndroid/app/src/main/java/ir/dinal/storehub/ui/SmartProduct.kt
          grep -q 'fun MoneyTextField' v13/StoreHubAndroid/app/src/main/java/ir/dinal/storehub/ui/Common.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate permanent signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)

      - name: Restore permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > v13/StoreHubAndroid/app/storehub-release.jks
          keytool -list -keystore v13/StoreHubAndroid/app/storehub-release.jks -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >/dev/null

      - name: Build signed release APK
        working-directory: v13/StoreHubAndroid
        env:
          ANDROID_KEYSTORE_PATH: storehub-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare APK
        run: cp v13/StoreHubAndroid/app/build/outputs/apk/release/app-release.apk DINAL-StoreHub-V13.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DINAL-StoreHub-V13-APK
          path: DINAL-StoreHub-V13.apk
          if-no-files-found: error
