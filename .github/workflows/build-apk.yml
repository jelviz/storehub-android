name: Build DINAL StoreHub V16.1 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'storehub-v16-1-source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract V16.1 source and verify fixes
        run: |
          rm -rf v161
          mkdir -p v161
          unzip -q -o storehub-v16-1-source.zip -d v161
          test -f v161/StoreHubAndroid/app/build.gradle.kts
          grep -q 'versionName = "16.1.0"' v161/StoreHubAndroid/app/build.gradle.kts
          grep -q 'versionCode = 17' v161/StoreHubAndroid/app/build.gradle.kts
          grep -q 'RequestPermission' v161/StoreHubAndroid/app/src/main/java/ir/dinal/storehub/ui/SmartProduct.kt
          grep -q 'prepareSmartProductWebp' v161/StoreHubAndroid/app/src/main/java/ir/dinal/storehub/publishing/ProductImageProcessor.kt
          grep -q 'DinalAssistantScreen' v161/StoreHubAndroid/app/src/main/java/ir/dinal/storehub/ui/DinalAssistant.kt
          grep -q 'assistantContext' v161/StoreHubAndroid/app/src/main/java/ir/dinal/storehub/data/LocalStore.kt
          grep -q 'tokens.count' v161/StoreHubAndroid/app/src/main/java/ir/dinal/storehub/data/LocalStore.kt
          grep -q 'orientation|screenSize|keyboardHidden' v161/StoreHubAndroid/app/src/main/AndroidManifest.xml
          grep -q 'dinal_cart_mark' v161/StoreHubAndroid/app/src/main/AndroidManifest.xml
          grep -q 'dinal_cart_mark' v161/StoreHubAndroid/app/src/main/java/ir/dinal/storehub/ui/SplashScreen.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate permanent signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)

      - name: Restore permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > v161/StoreHubAndroid/app/storehub-release.jks
          keytool -list -keystore v161/StoreHubAndroid/app/storehub-release.jks -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >/dev/null

      - name: Build signed release APK
        working-directory: v161/StoreHubAndroid
        env:
          ANDROID_KEYSTORE_PATH: storehub-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare APK
        run: cp v161/StoreHubAndroid/app/build/outputs/apk/release/app-release.apk DINAL-StoreHub-V16.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DINAL-StoreHub-V16.1-APK
          path: DINAL-StoreHub-V16.1.apk
          if-no-files-found: error
