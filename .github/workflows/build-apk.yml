name: Build DINAL StoreHub V16.2.2 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'StoreHubAndroid/**'
      - 'storehub-v16-2-source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify V16.2 source
        run: |
          test -f StoreHubAndroid/app/build.gradle.kts
          grep -q 'versionName = "16.2.2"' StoreHubAndroid/app/build.gradle.kts
          grep -q 'versionCode = 20' StoreHubAndroid/app/build.gradle.kts
          grep -q 'DinalAssistantScreen' StoreHubAndroid/app/src/main/java/ir/dinal/storehub/ui/DinalAssistant.kt
          grep -q 'tokens.count' StoreHubAndroid/app/src/main/java/ir/dinal/storehub/data/LocalStore.kt
          grep -q 'removeWhiteBackground' StoreHubAndroid/app/src/main/java/ir/dinal/storehub/publishing/ProductImageProcessor.kt
          grep -q 'gpt-4o-mini' StoreHubAndroid/app/src/main/java/ir/dinal/storehub/publishing/OpenAiProductClient.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate permanent signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)

      - name: Restore and validate permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > StoreHubAndroid/app/storehub-release.jks
          keytool -list \
            -keystore StoreHubAndroid/app/storehub-release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Permanent signing keystore and alias validated."

      - name: Build signed release APK
        working-directory: StoreHubAndroid
        env:
          ANDROID_KEYSTORE_PATH: storehub-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose StoreHubAndroid/app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK
        run: cp StoreHubAndroid/app/build/outputs/apk/release/app-release.apk DINAL-StoreHub-V16.2.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DINAL-StoreHub-V16.2.2-APK
          path: DINAL-StoreHub-V16.2.2.apk
          if-no-files-found: error
