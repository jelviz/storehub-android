name: Build DINAL StoreHub V7 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'storehub-v7-source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract V7 source
        run: |
          rm -rf v7
          mkdir -p v7
          unzip -q -o storehub-v7-source.zip -d v7
          test -f v7/StoreHubAndroid/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: v7/StoreHubAndroid
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp v7/StoreHubAndroid/app/build/outputs/apk/debug/app-debug.apk DINAL-StoreHub-V7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DINAL-StoreHub-V7-APK
          path: DINAL-StoreHub-V7.apk
          if-no-files-found: error
